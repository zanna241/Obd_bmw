name: Build BMW OBD firmware

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install PlatformIO
        run: pip install platformio
      - name: Build
        run: pio run
      - name: Prepare artifacts
        run: |
          mkdir -p release
          cp .pio/build/jc3248w535/firmware.bin release/BMW_520xd_MONITOR_V0992_STABILITY.bin
          sha256sum release/BMW_520xd_MONITOR_V0992_STABILITY.bin > release/BMW_520xd_MONITOR_V0992_STABILITY.bin.sha256
      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: BMW_520xd_MONITOR_V0992_STABILITY
          path: |
            release/BMW_520xd_MONITOR_V0992_STABILITY.bin
            release/BMW_520xd_MONITOR_V0992_STABILITY.bin.sha256

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: BMW_520xd_MONITOR_V0992_STABILITY
          path: release
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/BMW_520xd_MONITOR_V0992_STABILITY.bin
            release/BMW_520xd_MONITOR_V0992_STABILITY.bin.sha256
