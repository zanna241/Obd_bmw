name: Build BMW OBD firmware

on:
  push:
    branches: ["main"]
    tags: ["v*"]
    paths-ignore:
      - "firmware/**"
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install PlatformIO
        run: pip install platformio
      - name: Build
        run: pio run
      - name: Prepare artifacts
        run: |
          mkdir -p release
          cp .pio/build/jc3248w535/firmware.bin release/BMW_520xd_MONITOR_V0995_ONLINE_OTA.bin
          sha256sum release/BMW_520xd_MONITOR_V0995_ONLINE_OTA.bin > release/BMW_520xd_MONITOR_V0995_ONLINE_OTA.bin.sha256
      - name: Prepare public OTA channel
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p firmware
          cp .pio/build/jc3248w535/firmware.bin firmware/BMW_520xd_MONITOR_latest.bin
          VERSION=$(sed -n 's/^#define FW_VERSION "\([^"]*\)"/\1/p' include/version.h)
          BUILD=$(sed -n 's/^#define FW_BUILD_NAME "\([^"]*\)"/\1/p' include/version.h)
          SHA=$(sha256sum firmware/BMW_520xd_MONITOR_latest.bin | cut -d' ' -f1)
          SIZE=$(stat -c%s firmware/BMW_520xd_MONITOR_latest.bin)
          printf '%s\n' "{\"version\":\"${VERSION}\",\"build\":\"${BUILD}\",\"url\":\"https://raw.githubusercontent.com/zanna241/Obd_bmw/main/firmware/BMW_520xd_MONITOR_latest.bin\",\"sha256\":\"${SHA}\",\"size\":${SIZE},\"notes\":\"Aggiornamento OTA online da display touch\"}" > firmware/manifest.json
          sha256sum firmware/BMW_520xd_MONITOR_latest.bin > firmware/BMW_520xd_MONITOR_latest.bin.sha256
      - name: Publish public OTA channel
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firmware
          if ! git diff --cached --quiet; then
            git commit -m "Publish OTA firmware ${GITHUB_SHA::7} [skip ci]"
            git push
          fi
      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: BMW_520xd_MONITOR_V0995_ONLINE_OTA
          path: |
            release/BMW_520xd_MONITOR_V0995_ONLINE_OTA.bin
            release/BMW_520xd_MONITOR_V0995_ONLINE_OTA.bin.sha256

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: BMW_520xd_MONITOR_V0995_ONLINE_OTA
          path: release
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/BMW_520xd_MONITOR_V0995_ONLINE_OTA.bin
            release/BMW_520xd_MONITOR_V0995_ONLINE_OTA.bin.sha256
